<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="top-nav" aria-label="Navigation principale">
    <a href="index.html" class="nav-link active">Home</a>
    <a href="list.html" class="nav-link">List</a>
    <a href="propos.html" class="nav-link">Propos</a>
  </nav>

  <main class="page-shell">
    <section class="form-panel" aria-labelledby="page-title">
      <p class="eyebrow">Carnet de contacts</p>
      <h1 id="page-title">Ajouter un contact</h1>
      <p class="intro">Renseignez les coordonnées du nouveau contact.</p>

      <form id="contact-form">
        <div class="field-row">
          <label>
            Nom
            <input name="nom" type="text" maxlength="100" autocomplete="family-name" required>
          </label>
          <label>
            Prénom
            <input name="prenom" type="text" maxlength="100" autocomplete="given-name" required>
          </label>
        </div>

        <label>
          Adresse email
          <input name="email" type="email" maxlength="255" autocomplete="email" required>
        </label>

        <label>
          GSM
          <input name="gsm" type="tel" maxlength="30" autocomplete="tel" required>
        </label>

        <button type="submit">Enregistrer le contact</button>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
