<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des contacts</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="top-nav" aria-label="Navigation principale">
      <a href="index.html" class="nav-link">Home</a>
      <a href="list.html" class="nav-link active">List</a>
      <a href="propos.html" class="nav-link">Propos</a>
      <a href="modifier.html" class="nav-link">Modifier</a>
    </nav>

    <main class="page-shell list-page-shell">
      <section class="list-panel" aria-labelledby="list-title">
        <p class="eyebrow">Carnet de contacts</p>
        <h1 id="list-title">Liste des contacts</h1>
        <p class="intro">Consultez les contacts enregistrés.</p>

        <div class="search-box">
          <label for="search-name">Recherche par nom</label>
          <div class="search-controls">
            <input id="search-name" name="search-name" type="text" placeholder="Entrez un nom..." autocomplete="off">
            <button id="search-button" type="button" class="page-btn search-btn">Rechercher</button>
            <button id="reset-button" type="button" class="page-btn secondary-btn">Reset</button>
          </div>
        </div>

        <div class="result-info">
          <span id="result-count">0 résultats</span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th id="th-nom" class="sortable" data-sort="none">Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>GSM</th>
                <th>Ajouté le</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="contacts-body"></tbody>
          </table>
        </div>

        <div class="pagination" aria-label="Pagination des contacts">
          <button id="prev-page" type="button" class="page-btn">Précédent</button>
          <span id="page-indicator">Page 1</span>
          <button id="next-page" type="button" class="page-btn">Suivant</button>
        </div>
      </section>
    </main>

    <script src="list.js" defer></script>
  </body>
</html>
